<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>IVI</title>
    <script>
      // Theme before first paint (no flash). Dark is the default posture;
      // "light" is the surface theme, chosen explicitly and remembered.
      try {
        if (localStorage.getItem("ivi-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {}
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
