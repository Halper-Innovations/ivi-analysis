name: Data problem
description: A number that disagrees with the company's SEC filing.
labels: [data-quality]
body:
  - type: input
    id: ticker
    attributes:
      label: Ticker or CIK
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Line item and period
      placeholder: total_debt, FY2023 (as of 2024-06-01)
    validations:
      required: true
  - type: input
    id: values
    attributes:
      label: Value reported vs. value expected
      placeholder: "IVI: 198,276 — filing: 197,602 (USD millions)"
    validations:
      required: true
  - type: input
    id: filing
    attributes:
      label: Link to the filing that shows the expected value
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
